<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão Tryp Congonhas</title>
<style>
  :root{
    --azul-escuro:#1f3a5f;
    --azul-medio:#3a6ea5;
    --azul-claro:#eaf1f8;
    --azul-borda:#c7d7e8;
    --cinza-texto:#4a4a4a;
    --verde:#2e7d32;
    --laranja:#ef6c00;
    --vermelho:#c62828;
    --roxo:#6a1b9a;
    --cinza-bloq:#757575;
    --dourado:#c99b2e;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:#f4f7fb;color:var(--cinza-texto);}
  header{background:var(--azul-escuro);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  header h1{margin:0;font-size:22px;display:flex;align-items:center;gap:10px;}
  header button{background:var(--azul-medio);color:#fff;border:none;padding:10px 16px;border-radius:6px;cursor:pointer;font-size:14px;}
  header button:hover{background:#2f5a85;}
  #status-conexao{font-size:12px;opacity:.85;}

  #overlay-loading{position:fixed;inset:0;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:999;font-size:16px;color:var(--azul-escuro);gap:10px;}
  #overlay-loading.hidden{display:none;}
  .spinner{width:36px;height:36px;border:4px solid var(--azul-claro);border-top-color:var(--azul-medio);border-radius:50%;animation:girar 1s linear infinite;}
  @keyframes girar{to{transform:rotate(360deg);}}

  #dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;padding:18px 24px;}
  .card{background:#fff;border:1px solid var(--azul-borda);border-radius:8px;padding:14px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .card .num{font-size:22px;font-weight:700;color:var(--azul-escuro);}
  .card .lbl{font-size:12px;color:#777;margin-top:4px;}

  #filtros{background:#fff;margin:0 24px 18px;padding:14px;border-radius:8px;border:1px solid var(--azul-borda);display:flex;gap:10px;flex-wrap:wrap;align-items:end;}
  #filtros .campo{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#555;}
  #filtros input,#filtros select{padding:8px;border:1px solid var(--azul-borda);border-radius:6px;font-size:13px;min-width:140px;}
  #filtros button{padding:8px 14px;border:none;background:var(--azul-medio);color:#fff;border-radius:6px;cursor:pointer;height:36px;}
  #contador-resultados{font-size:13px;color:#555;margin-left:auto;align-self:center;}

  #legenda{display:flex;gap:16px;flex-wrap:wrap;padding:0 24px 18px;font-size:12px;color:#555;}
  #legenda span{display:flex;align-items:center;gap:6px;}
  .dot{width:12px;height:12px;border-radius:3px;display:inline-block;}

  #andares{padding:0 24px 40px;display:flex;flex-direction:column;gap:14px;}
  .andar-bloco{background:#fff;border:1px solid var(--azul-borda);border-radius:8px;overflow:hidden;}
  .andar-header{background:var(--azul-claro);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;flex-wrap:wrap;gap:8px;}
  .andar-header h2{margin:0;font-size:16px;color:var(--azul-escuro);}
  .andar-stats{font-size:12px;color:#555;display:flex;gap:10px;flex-wrap:wrap;}
  .andar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;padding:14px;}
  .andar-grid.collapsed{display:none;}

  .unit{position:relative;background:#f9fbfd;border:2px solid var(--verde);border-radius:6px;padding:6px 4px;text-align:center;cursor:pointer;font-size:11px;transition:.15s;}
  .unit:hover{transform:translateY(-2px);box-shadow:0 3px 8px rgba(0,0,0,.12);}
  .unit.disponivel{border-color:var(--verde);}
  .unit.reservada{border-color:var(--laranja);}
  .unit.vendida{border-color:var(--vermelho);}
  .unit.permuta{border-color:var(--roxo);}
  .unit.bloqueado{background:#ececec;}
  .unit.diferenciada{box-shadow:inset 0 0 0 2px var(--dourado);}
  .unit .num{font-weight:700;color:var(--azul-escuro);}
  .unit .area{color:#777;font-size:10px;}
  .unit .icones{position:absolute;top:2px;right:3px;font-size:10px;}
  .unit[hidden]{display:none;}

  .modal-overlay{position:fixed;inset:0;background:rgba(10,20,35,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:16px;}
  .modal-overlay.hidden{display:none;}
  .modal{background:#fff;border-radius:10px;max-width:520px;width:100%;max-height:90vh;overflow-y:auto;padding:22px;}
  .modal h2{margin-top:0;color:var(--azul-escuro);font-size:18px;}
  .modal .linha{margin-bottom:12px;display:flex;flex-direction:column;gap:4px;}
  .modal label{font-size:12px;font-weight:600;color:#555;}
  .modal input,.modal select,.modal textarea{padding:9px;border:1px solid var(--azul-borda);border-radius:6px;font-size:13px;width:100%;}
  .modal textarea{resize:vertical;min-height:60px;}
  .aviso-bloqueio{background:#fdecea;border:1px solid var(--vermelho);color:var(--vermelho);padding:8px;border-radius:6px;font-size:12px;margin-bottom:10px;}
  .oculto{display:none;}
  .modal-botoes{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;}
  .modal-botoes button{padding:9px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px;}
  .btn-cancelar{background:#e0e0e0;}
  .btn-salvar{background:var(--azul-medio);color:#fff;}
  .fechar-x{position:absolute;top:14px;right:18px;cursor:pointer;font-size:18px;color:#888;}
</style>
</head>
<body>

<div id="overlay-loading">
  <div class="spinner"></div>
  <div>Conectando ao banco de dados...</div>
</div>

<header>
  <h1>🏢 Gestão Tryp Congonhas</h1>
  <div style="display:flex;align-items:center;gap:14px;">
    <span id="status-conexao">🔄 Sincronizado</span>
    <button onclick="exportarCSV()">⬇ Exportar relatório (CSV)</button>
  </div>
</header>

<div id="dashboard"></div>

<div id="filtros">
  <div class="campo">
    <label>Buscar</label>
    <input type="text" id="f-busca" placeholder="Unidade, comprador, corretor...">
  </div>
  <div class="campo">
    <label>Pavimento</label>
    <select id="f-andar">
      <option value="">Todos</option>
    </select>
  </div>
  <div class="campo">
    <label>Situação</label>
    <select id="f-status">
      <option value="">Todas</option>
      <option value="disponivel">Disponível</option>
      <option value="reservada">Reservada</option>
      <option value="vendida">Vendida</option>
      <option value="permuta">Permuta</option>
      <option value="bloqueado">Bloqueada</option>
    </select>
  </div>
  <div class="campo">
    <label>Assinatura</label>
    <select id="f-assinatura">
      <option value="">Todas</option>
      <option value="sim">Assinado</option>
      <option value="pendente">Pendente</option>
      <option value="nao">Não assinado</option>
    </select>
  </div>
  <div class="campo">
    <label>Metragem</label>
    <select id="f-metragem">
      <option value="">Todas</option>
      <option value="diferenciadas">Diferenciadas (≥22m²)</option>
      <option value="padrao">Padrão</option>
    </select>
  </div>
  <button onclick="limparFiltros()">Limpar filtros</button>
  <div id="contador-resultados"></div>
</div>

<div id="legenda">
  <span><i class="dot" style="background:var(--verde)"></i> Disponível</span>
  <span><i class="dot" style="background:var(--laranja)"></i> Reservada</span>
  <span><i class="dot" style="background:var(--vermelho)"></i> Vendida</span>
  <span><i class="dot" style="background:var(--roxo)"></i> Permuta</span>
  <span><i class="dot" style="background:var(--cinza-bloq)"></i> 🔒 Bloqueada</span>
  <span>⭐ Metragem diferenciada</span>
  <span>✔ Assinado</span>
</div>

<div id="andares"></div>

<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal">
    <span class="fechar-x" onclick="fecharModal()">✖</span>
    <h2 id="modal-titulo">Unidade</h2>

    <div id="modal-aviso" class="aviso-bloqueio oculto">
      ⚠ Esta unidade está bloqueada. Não é possível marcar como Vendida ou Reservada enquanto o bloqueio estiver ativo.
    </div>

    <div class="linha">
      <label><input type="checkbox" id="m-bloqueado" onchange="toggleMotivoBloqueio()"> 🔒 Unidade bloqueada</label>
    </div>
    <div class="linha oculto" id="linha-motivo">
      <label>Motivo do bloqueio</label>
      <select id="m-motivo">
        <option value="permuta">Unidade de permuta</option>
        <option value="reserva_tecnica">Reserva técnica</option>
        <option value="outro">Outro motivo</option>
      </select>
    </div>

    <div class="linha">
      <label>Status</label>
      <select id="m-status">
        <option value="disponivel">Disponível</option>
        <option value="reservada">Reservada</option>
        <option value="vendida">Vendida</option>
        <option value="permuta">Permuta</option>
      </select>
    </div>

    <div class="linha">
      <label>Assinatura</label>
      <select id="m-assinado">
        <option value="nao">Não assinado</option>
        <option value="pendente">Pendente</option>
        <option value="sim">Assinado</option>
      </select>
    </div>

    <div class="linha">
      <label>Comprador / Cliente</label>
      <input type="text" id="m-comprador">
    </div>
    <div class="linha">
      <label>Corretor responsável</label>
      <input type="text" id="m-corretor">
    </div>
    <div class="linha">
      <label>Empresa parceira</label>
      <input type="text" id="m-empresa">
    </div>
    <div class="linha">
      <label>Condição de compra</label>
      <select id="m-condicao">
        <option value="">Selecione...</option>
        <option value="a_vista">À vista</option>
        <option value="financiamento_bancario">Financiamento bancário</option>
        <option value="parcelado_construtora">Parcelado com a construtora</option>
      </select>
    </div>
    <div class="linha">
      <label>Valor da unidade (VGV)</label>
      <input type="text" id="m-valor" oninput="onValorInput(event)">
    </div>
    <div class="linha">
      <label>Valor por m² (automático)</label>
      <input type="text" id="m-valorm2" readonly style="background:#f0f0f0">
    </div>
    <div class="linha">
      <label>Data da movimentação</label>
      <input type="date" id="m-data">
    </div>
    <div class="linha">
      <label>Observações</label>
      <textarea id="m-obs"></textarea>
    </div>

    <div class="modal-botoes">
      <button class="btn-cancelar" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" onclick="salvarUnidade()">Salvar alterações</button>
    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
/* ===================== CONFIG FIREBASE ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyDKUoiJ87ZFrhG0u6vRzpmtBxNuVHTocbo",
  authDomain: "tryp-congonhas.firebaseapp.com",
  databaseURL: "https://tryp-congonhas-default-rtdb.firebaseio.com",
  projectId: "tryp-congonhas",
  storageBucket: "tryp-congonhas.firebasestorage.app",
  messagingSenderId: "680207644260",
  appId: "1:680207644260:web:23fbc785e6ea83bc409171",
  measurementId: "G-X19D3GGC35"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const unidadesRef = db.ref('unidades');

/* ===================== DADOS BASE ===================== */
const AREAS = [21.98,21.28,21.28,21.28,21.28,21.28,21.28,21.28,21.35,28.63,
               28.63,21.35,21.28,21.28,21.28,21.28,21.28,21.28,21.28,21.28,
               22.00,22.00,21.35,21.28,21.28,21.28,21.35,22.97,22.97,21.28];

const STATUS_LABELS = {disponivel:'Disponível',reservada:'Reservada',vendida:'Vendida',permuta:'Permuta'};
const CONDICAO_LABELS = {a_vista:'À vista',financiamento_bancario:'Financiamento bancário',parcelado_construtora:'Parcelado com a construtora'};
const ASSINADO_LABELS = {nao:'Não assinado',pendente:'Pendente',sim:'Assinado'};
const MOTIVO_LABELS = {permuta:'Unidade de permuta',reserva_tecnica:'Reserva técnica',outro:'Outro motivo'};

let unidades = {};
let unidadeSelecionadaId = null;
let andaresColapsados = {};

function gerarUnidadesPadrao(){
  const obj = {};
  for(let andar=1; andar<=8; andar++){
    for(let pos=1; pos<=30; pos++){
      const id = andar*100+pos;
      obj[id] = {
        id, andar, pos, area: AREAS[pos-1],
        status:"disponivel", bloqueado:false, motivoBloqueio:"",
        assinado:"nao", comprador:"", corretor:"", empresa:"",
        condicao:"", valor:0, data:"", obs:""
      };
    }
  }
  return obj;
}

/* ===================== CONEXÃO COM FIREBASE ===================== */
unidadesRef.on('value', snapshot => {
  const dados = snapshot.val();
  if(!dados){
    const padrao = gerarUnidadesPadrao();
    unidadesRef.set(padrao);
    unidades = padrao;
  } else {
    unidades = dados;
  }
  document.getElementById('overlay-loading').classList.add('hidden');
  document.getElementById('status-conexao').textContent = '🔄 Sincronizado';
  renderizarTudo();
}, err => {
  document.getElementById('status-conexao').textContent = '⚠ Erro de conexão';
  alert('Não foi possível conectar ao banco de dados. Verifique sua internet.');
});

/* ===================== FORMATAÇÃO DE MOEDA ===================== */
function onValorInput(e){
  let digitos = e.target.value.replace(/\D/g,'');
  if(!digitos) digitos = '0';
  const numero = parseInt(digitos,10)/100;
  e.target.value = numero.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
  atualizarValorM2();
}
function getValorNumerico(input){
  const digitos = input.value.replace(/\D/g,'');
  return digitos ? parseInt(digitos,10)/100 : 0;
}
function formatarMoeda(v){
  return (v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
}
function atualizarValorM2(){
  const valor = getValorNumerico(document.getElementById('m-valor'));
  const u = unidades[unidadeSelecionadaId];
  const area = u ? u.area : 0;
  const m2 = area>0 ? valor/area : 0;
  document.getElementById('m-valorm2').value = formatarMoeda(m2);
}

/* ===================== RENDER ===================== */
function renderizarTudo(){
  preencherSelectAndar();
  renderizarDashboard();
  renderizarAndares();
}

function preencherSelectAndar(){
  const sel = document.getElementById('f-andar');
  if(sel.options.length>1) return;
  for(let a=1;a<=8;a++){
    const op = document.createElement('option');
    op.value=a; op.textContent=a+'º Andar';
    sel.appendChild(op);
  }
}

function renderizarDashboard(){
  const lista = Object.values(unidades);
  const total = lista.length;
  const disp = lista.filter(u=>u.status==='disponivel').length;
  const res = lista.filter(u=>u.status==='reservada').length;
  const vend = lista.filter(u=>u.status==='vendida').length;
  const perm = lista.filter(u=>u.status==='permuta').length;
  const bloq = lista.filter(u=>u.bloqueado).length;
  const vgvTotal = lista.reduce((s,u)=>s+(u.valor||0),0);
  const vgvVendido = lista.filter(u=>u.status==='vendida').reduce((s,u)=>s+(u.valor||0),0);

  document.getElementById('dashboard').innerHTML = `
    <div class="card"><div class="num">${total}</div><div class="lbl">Total de unidades</div></div>
    <div class="card"><div class="num">${disp}</div><div class="lbl">Disponíveis</div></div>
    <div class="card"><div class="num">${res}</div><div class="lbl">Reservadas</div></div>
    <div class="card"><div class="num">${vend}</div><div class="lbl">Vendidas</div></div>
    <div class="card"><div class="num">${perm}</div><div class="lbl">Permuta</div></div>
    <div class="card"><div class="num">${bloq}</div><div class="lbl">Bloqueadas</div></div>
    <div class="card"><div class="num">${formatarMoeda(vgvTotal)}</div><div class="lbl">VGV Total</div></div>
    <div class="card"><div class="num">${formatarMoeda(vgvVendido)}</div><div class="lbl">VGV Vendido</div></div>
  `;
}

function unidadeBateComFiltros(u){
  const busca = document.getElementById('f-busca').value.trim().toLowerCase();
  const fAndar = document.getElementById('f-andar').value;
  const fStatus = document.getElementById('f-status').value;
  const fAssin = document.getElementById('f-assinatura').value;
  const fMetro = document.getElementById('f-metragem').value;

  if(fAndar && String(u.andar)!==fAndar) return false;
  if(fStatus==='bloqueado' && !u.bloqueado) return false;
  if(fStatus && fStatus!=='bloqueado' && u.status!==fStatus) return false;
  if(fAssin && u.assinado!==fAssin) return false;
  if(fMetro==='diferenciadas' && u.area<22) return false;
  if(fMetro==='padrao' && u.area>=22) return false;

  if(busca){
    const condTxt = CONDICAO_LABELS[u.condicao] || '';
    const campo = `${u.id} ${u.comprador||''} ${u.corretor||''} ${u.empresa||''} ${condTxt}`.toLowerCase();
    if(!campo.includes(busca)) return false;
  }
  return true;
}

function renderizarAndares(){
  const cont = document.getElementById('andares');
  cont.innerHTML = '';
  let totalVisiveis = 0;

  for(let andar=8; andar>=1; andar--){
    const unidadesAndar = [];
    for(let pos=1;pos<=30;pos++){
      unidadesAndar.push(unidades[andar*100+pos]);
    }
    const visiveis = unidadesAndar.filter(unidadeBateComFiltros);
    totalVisiveis += visiveis.length;

    const disp = unidadesAndar.filter(u=>u.status==='disponivel').length;
    const res = unidadesAndar.filter(u=>u.status==='reservada').length;
    const vend = unidadesAndar.filter(u=>u.status==='vendida').length;
    const perm = unidadesAndar.filter(u=>u.status==='permuta').length;
    const bloq = unidadesAndar.filter(u=>u.bloqueado).length;

    const bloco = document.createElement('div');
    bloco.className = 'andar-bloco';
    bloco.innerHTML = `
      <div class="andar-header" onclick="toggleAndar(${andar})">
        <h2>${andar}º Andar</h2>
        <div class="andar-stats">
          <span>🟢 ${disp} disp.</span>
          <span>🟠 ${res} res.</span>
          <span>🔴 ${vend} vend.</span>
          <span>🟣 ${perm} permuta</span>
          <span>🔒 ${bloq} bloq.</span>
        </div>
      </div>
      <div class="andar-grid ${andaresColapsados[andar]?'collapsed':''}" id="grid-${andar}"></div>
    `;
    cont.appendChild(bloco);

    const grid = bloco.querySelector(`#grid-${andar}`);
    unidadesAndar.forEach(u=>{
      const visivel = unidadeBateComFiltros(u);
      const div = document.createElement('div');
      div.className = `unit ${u.status} ${u.bloqueado?'bloqueado':''} ${u.area>=22?'diferenciada':''}`;
      if(!visivel) div.setAttribute('hidden','');
      div.onclick = () => abrirModal(u.id);
      div.title = `${u.comprador?('Comprador: '+u.comprador+'\\n'):''}${u.valor?('VGV: '+formatarMoeda(u.valor)+'\\n'):''}${u.bloqueado?('Bloqueio: '+MOTIVO_LABELS[u.motivoBloqueio]):''}`;
      div.innerHTML = `
        <div class="icones">${u.bloqueado?'🔒':''}${u.assinado==='sim'?'✔':(u.assinado==='pendente'?'◐':'')}${u.area>=22?'⭐':''}</div>
        <div class="num">${u.id}</div>
        <div class="area">${u.area.toFixed(2)}m²</div>
      `;
      grid.appendChild(div);
    });
  }

  document.getElementById('contador-resultados').textContent = `${totalVisiveis} unidade(s) encontrada(s)`;
}

function toggleAndar(andar){
  andaresColapsados[andar] = !andaresColapsados[andar];
  renderizarAndares();
}

function limparFiltros(){
  document.getElementById('f-busca').value='';
  document.getElementById('f-andar').value='';
  document.getElementById('f-status').value='';
  document.getElementById('f-assinatura').value='';
  document.getElementById('f-metragem').value='';
  renderizarAndares();
}
['f-busca','f-andar','f-status','f-assinatura','f-metragem'].forEach(id=>{
  document.addEventListener('DOMContentLoaded', ()=>{
    document.getElementById(id).addEventListener('input', renderizarAndares);
    document.getElementById(id).addEventListener('change', renderizarAndares);
  });
});

/* ===================== MODAL ===================== */
function abrirModal(id){
  unidadeSelecionadaId = id;
  const u = unidades[id];
  document.getElementById('modal-titulo').textContent = `Unidade ${u.id} — ${u.area.toFixed(2)}m²`;
  document.getElementById('m-bloqueado').checked = !!u.bloqueado;
  document.getElementById('m-motivo').value = u.motivoBloqueio || 'permuta';
  document.getElementById('m-status').value = u.status;
  document.getElementById('m-assinado').value = u.assinado || 'nao';
  document.getElementById('m-comprador').value = u.comprador || '';
  document.getElementById('m-corretor').value = u.corretor || '';
  document.getElementById('m-empresa').value = u.empresa || '';
  document.getElementById('m-condicao').value = u.condicao || '';
  document.getElementById('m-valor').value = formatarMoeda(u.valor || 0);
  document.getElementById('m-data').value = u.data || '';
  document.getElementById('m-obs').value = u.obs || '';
  toggleMotivoBloqueio();
  atualizarValorM2();
  document.getElementById('modal-overlay').classList.remove('hidden');
}

function toggleMotivoBloqueio(){
  const marcado = document.getElementById('m-bloqueado').checked;
  document.getElementById('linha-motivo').classList.toggle('oculto', !marcado);
  document.getElementById('modal-aviso').classList.toggle('oculto', !marcado);
}

function fecharModal(){
  document.getElementById('modal-overlay').classList.add('hidden');
  unidadeSelecionadaId = null;
}
document.addEventListener('keydown', e=>{ if(e.key==='Escape') fecharModal(); });
document.getElementById('modal-overlay')?.addEventListener('click', e=>{
  if(e.target.id==='modal-overlay') fecharModal();
});

function salvarUnidade(){
  const id = unidadeSelecionadaId;
  const bloqueado = document.getElementById('m-bloqueado').checked;
  const status = document.getElementById('m-status').value;

  if(bloqueado && (status==='vendida' || status==='reservada')){
    alert('Esta unidade está bloqueada. Desmarque o bloqueio antes de marcar como Vendida ou Reservada.');
    return;
  }

  const atualizado = {
    id, andar: unidades[id].andar, pos: unidades[id].pos, area: unidades[id].area,
    status,
    bloqueado,
    motivoBloqueio: bloqueado ? document.getElementById('m-motivo').value : '',
    assinado: document.getElementById('m-assinado').value,
    comprador: document.getElementById('m-comprador').value.trim(),
    corretor: document.getElementById('m-corretor').value.trim(),
    empresa: document.getElementById('m-empresa').value.trim(),
    condicao: document.getElementById('m-condicao').value,
    valor: getValorNumerico(document.getElementById('m-valor')),
    data: document.getElementById('m-data').value,
    obs: document.getElementById('m-obs').value.trim()
  };

  unidades[id] = atualizado;
  renderizarTudo();
  document.getElementById('status-conexao').textContent = '⏳ Salvando...';
  unidadesRef.child(id).set(atualizado)
    .then(()=>{ document.getElementById('status-conexao').textContent = '🔄 Sincronizado'; })
    .catch(()=>{ document.getElementById('status-conexao').textContent = '⚠ Erro ao salvar'; alert('Erro ao salvar. Verifique sua internet e tente novamente.'); });

  fecharModal();
}

/* ===================== EXPORTAR CSV ===================== */
function exportarCSV(){
  const linhas = [['Unidade','Andar','Area(m2)','Status','Bloqueado','Motivo Bloqueio','Assinatura','Comprador','Corretor','Empresa Parceira','Condicao de Compra','VGV(R$)','Data','Observacoes']];
  Object.values(unidades).sort((a,b)=>a.id-b.id).forEach(u=>{
    linhas.push([
      u.id, u.andar, u.area.toFixed(2),
      STATUS_LABELS[u.status]||u.status,
      u.bloqueado?'Sim':'Não',
      u.bloqueado?(MOTIVO_LABELS[u.motivoBloqueio]||''):'',
      ASSINADO_LABELS[u.assinado]||'',
      u.comprador||'', u.corretor||'', u.empresa||'',
      CONDICAO_LABELS[u.condicao]||'',
      (u.valor||0).toFixed(2).replace('.',','),
      u.data||'', (u.obs||'').replace(/;/g,',')
    ]);
  });
  const csv = linhas.map(l=>l.join(';')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'gestao_tryp_congonhas.csv';
  a.click();
  URL.revokeObjectURL(url);
}
</script>
